spring.application.name=escala-ministros

# ---------- Banco de dados PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/escala_ministros
spring.datasource.username=postgres
spring.datasource.password=net.net6910
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# NAO usar hibernate.jdbc.time_zone=UTC aqui: as entidades usam LocalDate/LocalTime
# (sem fuso) e essa propriedade gravava/ligava a hora deslocada (19:30 virava 22:30
# no banco). Sem ela, a hora e gravada exatamente como digitada.
spring.jpa.defer-datasource-initialization=false

# ---------- Login simples ----------
# O login é feito pelo TokenService abaixo (usuario/senha do app), por isso
# desligamos o usuario padrao gerado automaticamente pelo Spring Security.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
app.auth.username=admin
app.auth.password=admin123
app.auth.token-ttl-hours=12

# Carga de demonstracao quando o banco estiver vazio (false = banco limpo)
app.seed.demo=true

# ---------- Servidor ----------
server.port=8080
server.error.include-message=always
